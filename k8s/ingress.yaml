apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
spec:
  ingressClassName: nginx
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8080
  # TLS optional; configure a TLS secret when HTTPS is available.
  # tls:
  #   - hosts:
  #       - webapp.example.com
  #     secretName: webapp-tls
